<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZIZ Knowledge Studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F2E7;--surf:#FFFFFF;--ink:#1D1D1D;--mute:#5d564b;--gold:#AB7431;--line:#e3d9c4;--onGold:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1D1D;--surf:#272521;--ink:#F7F2E7;--mute:#b9b09f;--gold:#C98F4A;--line:#3a362f;--onGold:#1D1D1D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1D1D;--surf:#272521;--ink:#F7F2E7;--mute:#b9b09f;--gold:#C98F4A;--line:#3a362f;--onGold:#1D1D1D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:20px 18px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.logo{font:700 26px "Reem Kufi",sans-serif;letter-spacing:.14em;color:var(--gold)}
.sub{color:var(--mute);font-size:13px}
.hero h1{font-size:38px;font-weight:700}.hero p{color:var(--mute);max-width:34ch}
.tag{border-block:1px solid var(--line);padding:10px 0;margin:22px 0;display:flex;gap:18px;font:500 17px "Reem Kufi",sans-serif;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:var(--onGold);border:0;border-radius:10px;padding:12px 20px;font:600 15px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:14px}
.list{display:grid;gap:12px;margin-top:16px}
.item{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item h3{font-size:19px;color:var(--gold)}.item p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:28px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips button{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;inset:auto 0 0 0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:12px 2px;font-size:13px;color:var(--mute);text-decoration:none;font-weight:600}
nav a.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:18px;cursor:pointer}
.sep{height:1px;background:var(--line);margin:22px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var D={ar:{home:"الرئيسية",shop:"الكتب",reserve:"احجز",cart:"السلة",more:"المزيد",
h1:"مش مجرد مكان… مساحة لأفكارك",hp:"كتب، قهوة، مساحة للدراسة والشغل، طباعة وتصميم، وورش عمل في مكان واحد.",
s1:"احجز مساحة",s2:"تصفح الكتب",search:"ابحث عن كتاب",all:"الكل",empty:"الكتالوج قيد التجهيز. اطلب أي كتاب وهنرد عليك.",
reqT:"مش لاقي كتاب؟ اطلبه",reqP:"اسم الكتاب أو المؤلف",add:"أضف للسلة",cartE:"السلة فاضية.",total:"الإجمالي",
sendO:"ابعت الطلب على واتساب",space:"مساحة الدراسة",ws:"ورشة",print:"طباعة وتصميم",name:"الاسم",date:"التاريخ",from:"من",to:"إلى",
ppl:"عدد الأشخاص",note:"ملاحظات",send:"ابعت على واتساب",topic:"الموضوع",type:"النوع",qtyL:"الكمية",
topics:["الذكاء الاصطناعي","Revit","AutoCAD","BIM","التصميم الجرافيكي","مهارات البحث","التفكير الإبداعي"],
ptypes:["فلاير","كارت شخصي","بوستر","طباعة مستندات","تصميم آخر"],
confirm:"الأسعار والمواعيد بنأكدها معاك على واتساب.",lang:"English",theme:"الوضع الداكن / الفاتح",
owner:"وضع المالك",pin:"اكتب رمز المالك (لو أول مرة، اختار رمز جديد)",bad:"الرمز غلط",
title:"اسم الكتاب",author:"المؤلف",price:"السعر (اختياري)",cat:"التصنيف",addI:"أضف للكتالوج",del:"حذف",
exp:"نسخ بيانات الكتالوج",imp:"استيراد بيانات",copied:"اتنسخت",contact:"تواصل معانا",addr:"العاشر من رمضان، مصر",
stor:"بيانات الكتالوج محفوظة على جهازك فقط.",hi:"مرحباً AZIZ Knowledge Studio",out:"خروج"},
en:{home:"Home",shop:"Books",reserve:"Reserve",cart:"Cart",more:"More",
h1:"Not just a place. A space for your ideas.",hp:"Books, coffee, study and work space, print and design, and workshops under one roof.",
s1:"Reserve a space",s2:"Browse books",search:"Search books",all:"All",empty:"The catalog is being prepared. Request any book and we will reply.",
reqT:"Cannot find a book? Request it",reqP:"Book title or author",add:"Add to cart",cartE:"Your cart is empty.",total:"Total",
sendO:"Send order on WhatsApp",space:"Study space",ws:"Workshop",print:"Print and design",name:"Name",date:"Date",from:"From",to:"To",
ppl:"People",note:"Notes",send:"Send on WhatsApp",topic:"Topic",type:"Type",qtyL:"Quantity",
topics:["Artificial intelligence","Revit","AutoCAD","BIM","Graphic design","Research skills","Creative thinking"],
ptypes:["Flyer","Business card","Poster","Document printing","Other design"],
confirm:"We confirm prices and times with you on WhatsApp.",lang:"العربية",theme:"Dark / light mode",
owner:"Owner mode",pin:"Enter owner PIN (first time: choose a new one)",bad:"Wrong PIN",
title:"Book title",author:"Author",price:"Price (optional)",cat:"Category",addI:"Add to catalog",del:"Delete",
exp:"Copy catalog data",imp:"Import data",copied:"Copied",contact:"Contact us",addr:"10th of Ramadan City, Egypt",
stor:"Catalog data is stored on this device only.",hi:"Hello AZIZ Knowledge Studio",out:"Exit"}};
var WA="201121793604",$=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var L=ld("lang","ar"),items=ld("items",[]),cart=ld("cart",{}),owner=false,rs="space",q="",cat="";
function t(k){return D[L][k]}
function wa(m){return "https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
function open_(m){window.open(wa(m),"_blank")}
function cnt(){var n=0;for(var k in cart)n+=cart[k];return n}
function inp(id,l,ty){return '<label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(ty||"text")+'">'}
function v(id){var e=document.getElementById(id);return e?e.value.trim():""}
function sel(id,l,arr){return '<label for="'+id+'">'+l+'</label><select id="'+id+'">'+arr.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+"</select>"}
function route(){var h=(location.hash||"#home").slice(1);return ["home","shop","reserve","cart","more"].indexOf(h)<0?"home":h}
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 var r=route(),h='<div class="brand"><div class="logo">AZIZ</div><div class="sub">Knowledge Studio</div></div>';
 if(r=="home")h+='<div class="hero"><h1>'+t("h1")+'</h1><p>'+t("hp")+'</p><div class="tag"><span>Books</span><span>Coffee</span><span>Ideas</span><span>Creation</span></div><a class="btn" href="#reserve">'+t("s1")+'</a> <a class="btn alt" href="#shop">'+t("s2")+'</a></div>';
 if(r=="shop")h+='<h2>'+t("shop")+'</h2><input id="q" placeholder="'+t("search")+'" value="'+esc(q)+'"><div class="chips" id="cats"></div><div class="list" id="list"></div><div class="sep"></div><h3>'+t("reqT")+'</h3>'+inp("rq",t("reqP"))+'<p><button class="btn" data-a="req">'+t("send")+'</button></p>';
 if(r=="reserve"){h+='<h2>'+t("reserve")+'</h2><div class="chips">'+[["space","space"],["ws","ws"],["print","print"]].map(function(x){return '<button data-a="rs" data-v="'+x[0]+'" class="'+(rs==x[0]?"on":"")+'">'+t(x[1])+"</button>"}).join("")+"</div>"+inp("n",t("name"));
  if(rs=="space")h+=inp("d",t("date"),"date")+'<div class="g2"><div>'+inp("f",t("from"),"time")+'</div><div>'+inp("to",t("to"),"time")+'</div></div>'+inp("p",t("ppl"),"number");
  if(rs=="ws")h+=sel("tp",t("topic"),t("topics"));
  if(rs=="print")h+=sel("tp",t("type"),t("ptypes"))+inp("p",t("qtyL"),"number");
  h+='<label for="nt">'+t("note")+'</label><textarea id="nt"></textarea><p><button class="btn" data-a="send">'+t("send")+'</button></p><p class="note">'+t("confirm")+'</p>'}
 if(r=="cart"){h+='<h2>'+t("cart")+'</h2>';var ids=Object.keys(cart),tot=0,ok=true,lines=[];
  if(!ids.length)h+='<p class="sub">'+t("cartE")+'</p>';
  else{h+='<div class="list">';ids.forEach(function(id){var it=items.filter(function(x){return x.id==id})[0];if(!it)return;var pr=parseFloat(it.price);if(isNaN(pr))ok=false;else tot+=pr*cart[id];lines.push("- "+it.title+" x"+cart[id]+(it.price?" ("+it.price+")":""));
   h+='<div class="item row"><div><h3>'+esc(it.title)+'</h3><span class="sub">'+esc(it.price||"")+'</span></div><div class="qty"><button data-a="dec" data-v="'+id+'">-</button><b>'+cart[id]+'</b><button data-a="inc" data-v="'+id+'">+</button></div></div>'});
   h+='</div>'+(ok&&tot?'<p><b>'+t("total")+': '+tot+'</b></p>':'')+'<p><button class="btn" data-a="order">'+t("sendO")+'</button></p>'}}
 if(r=="more"){h+='<h2>'+t("more")+'</h2><p><button class="btn alt" data-a="lang">'+t("lang")+'</button> <button class="btn alt" data-a="theme">'+t("theme")+'</button></p><div class="item"><h3>'+t("contact")+'</h3><p>01121793604 · '+t("addr")+'</p><a class="btn sm" target="_blank" rel="noopener" href="'+wa(t("hi"))+'">WhatsApp</a> <a class="btn sm alt" href="tel:+201121793604">☎</a></div><div class="sep"></div>';
  if(!owner)h+='<button class="btn alt" data-a="owner">'+t("owner")+'</button>';
  else{h+='<h3>'+t("owner")+'</h3>'+inp("ti",t("title"))+inp("au",t("author"))+inp("pr",t("price"))+inp("ca",t("cat"))+'<p><button class="btn" data-a="additem">'+t("addI")+'</button> <button class="btn alt" data-a="out">'+t("out")+'</button></p><div class="list">'+items.map(function(it){return '<div class="item row"><span>'+esc(it.title)+'</span><button class="btn sm alt" data-a="del" data-v="'+it.id+'">'+t("del")+'</button></div>'}).join("")+'</div><p><button class="btn sm alt" data-a="exp">'+t("exp")+'</button> <button class="btn sm alt" data-a="imp">'+t("imp")+'</button></p><p class="note">'+t("stor")+'</p>'}}
 $("#app").innerHTML=h;
 $("#nav").innerHTML=["home","shop","reserve","cart","more"].map(function(k){return '<a href="#'+k+'" class="'+(r==k?"on":"")+'">'+t(k)+(k=="cart"&&cnt()?" ("+cnt()+")":"")+"</a>"}).join("");
 if(r=="shop"){draw();$("#q").oninput=function(e){q=e.target.value;draw()}}
 window.scrollTo(0,0)}
function draw(){
 var cs=[];items.forEach(function(i){if(i.cat&&cs.indexOf(i.cat)<0)cs.push(i.cat)});
 $("#cats").innerHTML=cs.length?['<button data-a="cat" data-v="" class="'+(cat?"":"on")+'">'+t("all")+"</button>"].concat(cs.map(function(c){return '<button data-a="cat" data-v="'+esc(c)+'" class="'+(cat==c?"on":"")+'">'+esc(c)+"</button>"})).join(""):"";
 var f=items.filter(function(i){return(!cat||i.cat==cat)&&(i.title+" "+i.author).toLowerCase().indexOf(q.toLowerCase())>-1});
 $("#list").innerHTML=f.length?f.map(function(i){return '<div class="item"><h3>'+esc(i.title)+'</h3><p>'+esc(i.author||"")+'</p><div class="row"><b>'+esc(i.price||"")+'</b><button class="btn sm" data-a="add" data-v="'+i.id+'">'+t("add")+"</button></div></div>"}).join(""):'<p class="sub">'+t("empty")+"</p>"}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,x=b.dataset.v;
 if(a=="add"){cart[x]=(cart[x]||0)+1;sv("cart",cart);$("#nav").innerHTML&&render()}
 else if(a=="inc"){cart[x]++;sv("cart",cart);render()}
 else if(a=="dec"){cart[x]--;if(cart[x]<1)delete cart[x];sv("cart",cart);render()}
 else if(a=="order"){var l=[];Object.keys(cart).forEach(function(id){var it=items.filter(function(y){return y.id==id})[0];if(it)l.push("- "+it.title+" x"+cart[id]+(it.price?" ("+it.price+")":""))});open_(t("hi")+"\n"+l.join("\n"))}
 else if(a=="req")open_(t("hi")+"\n"+t("reqT")+": "+v("rq"));
 else if(a=="rs"){rs=x;render()}
 else if(a=="cat"){cat=x;draw()}
 else if(a=="send"){var m=t("hi")+"\n"+t("name")+": "+v("n")+"\n"+t(rs)+(v("tp")?" - "+v("tp"):"");
  if(rs=="space")m+="\n"+t("date")+": "+v("d")+" "+v("f")+" - "+v("to")+"\n"+t("ppl")+": "+v("p");
  if(rs=="print")m+="\n"+t("qtyL")+": "+v("p");
  if(v("nt"))m+="\n"+v("nt");open_(m)}
 else if(a=="lang"){L=L=="ar"?"en":"ar";sv("lang",L);render()}
 else if(a=="theme"){var r=document.documentElement,dk=getComputedStyle(r).colorScheme=="dark"?"light":"dark";r.dataset.theme=dk;sv("theme",dk)}
 else if(a=="owner"){var p=ld("pin",null),s=prompt(t("pin"));if(s==null)return;if(!p){sv("pin",s);owner=true}else if(s==p)owner=true;else alert(t("bad"));render()}
 else if(a=="out"){owner=false;render()}
 else if(a=="additem"){if(!v("ti"))return;items.push({id:String(Date.now()),title:v("ti"),author:v("au"),price:v("pr"),cat:v("ca")});sv("items",items);render()}
 else if(a=="del"){items=items.filter(function(i){return i.id!=x});delete cart[x];sv("items",items);sv("cart",cart);render()}
 else if(a=="exp"){var j=JSON.stringify(items);if(navigator.clipboard)navigator.clipboard.writeText(j).then(function(){alert(t("copied"))},function(){prompt("",j)});else prompt("",j)}
 else if(a=="imp"){var s=prompt("JSON");try{var d=JSON.parse(s);if(Array.isArray(d)){items=d;sv("items",items);render()}}catch(er){}}
});
var th=ld("theme",null);if(th)document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
